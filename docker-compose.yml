services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SAFEGUARD_ENV: ${SAFEGUARD_ENV:-production}
      SAFEGUARD_API_TITLE: ${SAFEGUARD_API_TITLE:-SafeGuard API}
      SAFEGUARD_API_VERSION: ${SAFEGUARD_API_VERSION:-0.1.0}
      SAFEGUARD_LOG_LEVEL: ${SAFEGUARD_LOG_LEVEL:-INFO}
      SAFEGUARD_MODEL_VERSION: ${SAFEGUARD_MODEL_VERSION:-unloaded}
      SAFEGUARD_MODEL_PATH: ${SAFEGUARD_MODEL_PATH:-/app/models/production/safeguard_yolo11s.onnx}
      SAFEGUARD_CONF_THRESHOLD: ${SAFEGUARD_CONF_THRESHOLD:-0.25}
      SAFEGUARD_IOU_THRESHOLD: ${SAFEGUARD_IOU_THRESHOLD:-0.50}
      SAFEGUARD_COMPLIANCE_CONFIRM_FRAMES: ${SAFEGUARD_COMPLIANCE_CONFIRM_FRAMES:-3}
      SAFEGUARD_COMPLIANCE_COOLDOWN_SECONDS: ${SAFEGUARD_COMPLIANCE_COOLDOWN_SECONDS:-10.0}
      SAFEGUARD_COMPLIANCE_CAPTURE_EVIDENCE: ${SAFEGUARD_COMPLIANCE_CAPTURE_EVIDENCE:-true}
      SAFEGUARD_CORS_ORIGINS: ${SAFEGUARD_CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}
    volumes:
      - ./models/production:/app/models/production:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - safeguard_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - safeguard_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - safeguard_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  mlflow_data:

networks:
  safeguard_net:
    driver: bridge
