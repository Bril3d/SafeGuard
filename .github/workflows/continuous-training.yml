name: Continuous Training (CT) & Drift Check

on:
  workflow_dispatch:
    inputs:
      force_retrain:
        description: "Force CT retraining dry-run evaluation"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main]
    paths:
      - "src/monitoring/**"
      - "src/orchestration/**"
      - ".github/workflows/continuous-training.yml"

jobs:
  ct-drift-and-prefect:
    name: Proxy Drift Assessment & Prefect CT Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU orchestration and drift dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "dvc>=3.50.0,<4.0.0"

      - name: Run Evidently proxy drift check against validation statistics
        run: python -m src.monitoring.drift --output-json reports/monitoring/drift_report.json --output-html reports/monitoring/drift_report.html

      - name: Execute Prefect CT flow (CPU dry-run)
        run: |
          if [ "${{ github.event.inputs.force_retrain }}" = "true" ]; then
            python -m src.orchestration.prefect_flows --mode ct --force-retrain
          else
            python -m src.orchestration.prefect_flows --mode ct
          fi

      - name: Upload drift report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ct-drift-report
          path: |
            reports/monitoring/drift_report.json
            reports/monitoring/drift_report.html
